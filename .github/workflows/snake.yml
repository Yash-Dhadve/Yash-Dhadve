name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"     # runs once a day
  workflow_dispatch:         # allows manual trigger
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Yash-Dhadve
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#2ecc71&color_dots=#040a06,#112718,#1b4d32,#2a7b4c,#34c759
            dist/github-contribution-grid-snake.svg?color_snake=#2ecc71&color_dots=#e8f5e9,#c8e6c9,#a5d6a7,#81c784,#4caf50

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
