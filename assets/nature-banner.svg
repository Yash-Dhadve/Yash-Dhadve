<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020804"/>
      <stop offset="50%" stop-color="#0c1d11"/>
      <stop offset="100%" stop-color="#020804"/>
    </linearGradient>
    
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#0b301a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="canopyGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#14301d" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#07170d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020804" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Leaf-Mint Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#a8ffb2"/>
      <stop offset="70%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#1b5e3a"/>
    </linearGradient>

    <linearGradient id="subTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1ffd9"/>
      <stop offset="50%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#d1ffd9"/>
    </linearGradient>

    <!-- Filters for Glow and Shadows -->
    <filter id="fireflyGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#glowGreen)">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient forest light at bottom -->
  <rect x="0" y="180" width="1200" height="80" fill="url(#canopyGrad)"/>

  <!-- Left Vine / Leaf Silhouette -->
  <g transform="translate(60, 30)" fill="#0d2416" opacity="0.8">
    <path d="M 0,0 C 30,20 40,60 10,120 C 30,100 50,70 40,30 Z"/>
    <path d="M 15,40 C 45,55 55,85 35,130 C 50,110 65,85 50,50 Z"/>
    <!-- Leaf shapes -->
    <path d="M 10,120 Q 30,130 40,150 Q 20,150 10,120 Z" fill="#1b4d32" stroke="#2ecc71" stroke-width="0.5"/>
    <path d="M 35,130 Q 55,140 65,160 Q 45,160 35,130 Z" fill="#1b4d32" stroke="#2ecc71" stroke-width="0.5"/>
  </g>

  <!-- Right Vine / Leaf Silhouette -->
  <g transform="translate(1060, 30) scale(-1, 1)" fill="#0d2416" opacity="0.8">
    <path d="M 0,0 C 30,20 40,60 10,120 C 30,100 50,70 40,30 Z"/>
    <path d="M 15,40 C 45,55 55,85 35,130 C 50,110 65,85 50,50 Z"/>
    <!-- Leaf shapes -->
    <path d="M 10,120 Q 30,130 40,150 Q 20,150 10,120 Z" fill="#1b4d32" stroke="#2ecc71" stroke-width="0.5"/>
    <path d="M 35,130 Q 55,140 65,160 Q 45,160 35,130 Z" fill="#1b4d32" stroke="#2ecc71" stroke-width="0.5"/>
  </g>

  <!-- Floating Fireflies (Soft Glowing Greenish Gold) -->
  <g fill="#d1ffd9">
    <circle cx="180" cy="220" r="3" filter="url(#fireflyGlow)">
      <animate attributeName="cy" values="220;40;220" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180;220;180" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="180" r="2" filter="url(#fireflyGlow)" fill="#ffd700">
      <animate attributeName="cy" values="180;30;180" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="320;290;320" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="200" r="2.5" filter="url(#fireflyGlow)">
      <animate attributeName="cy" values="200;60;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="550;580;550" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="210" r="2" filter="url(#fireflyGlow)" fill="#ffd700">
      <animate attributeName="cy" values="210;50;210" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="780;810;780" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="230" r="3" filter="url(#fireflyGlow)">
      <animate attributeName="cy" values="230;70;230" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="950;920;950" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central Crest / Organic Mandala background -->
  <g opacity="0.06" stroke="#2ecc71" stroke-width="1.5" fill="none">
    <circle cx="600" cy="130" r="100"/>
    <circle cx="600" cy="130" r="70"/>
    <path d="M 600,30 L 600,230 M 500,130 L 700,130"/>
  </g>

  <!-- Hero Text -->
  <g filter="url(#textGlow)">
    <text x="600" y="115" text-anchor="middle" font-family="'Cinzel', 'Segoe UI', serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="8">
      YASH DHADVE
    </text>
  </g>
  <text x="600" y="155" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="url(#subTitleGrad)" letter-spacing="4">
    FULL STACK DEVELOPER • PYTHON DEVELOPER
  </text>
  
  <text x="600" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#2ecc71" letter-spacing="2">
    🌿 GROW MODE: ACTIVE 🌿
  </text>
</svg>
