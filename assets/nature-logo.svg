<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2ecc71" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glowing Background -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGlow)"/>
  
  <!-- Outer Ring (Vines/Organic) -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#1b5e3a" stroke-width="1.5" opacity="0.6"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="#2ecc71" stroke-width="0.5" opacity="0.3"/>

  <!-- Botanical Sprout -->
  <g transform="translate(10, 10)">
    <!-- Stem -->
    <path d="M 40,65 Q 40,40 46,25" fill="none" stroke="#2ecc71" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
    
    <!-- Left Leaf -->
    <path d="M 40,45 C 25,45 22,30 40,38 C 40,38 40,45 40,45 Z" fill="#1b5e3a" stroke="#2ecc71" stroke-width="1"/>
    <!-- Right Leaf -->
    <path d="M 42,35 C 57,32 55,18 43,26 C 43,26 42,35 42,35 Z" fill="#2ecc71" stroke="#a8ffb2" stroke-width="1" filter="url(#glow)"/>
    
    <!-- Small Bud on top -->
    <circle cx="46" cy="24" r="2" fill="#ffd700" filter="url(#glow)"/>
  </g>
</svg>
