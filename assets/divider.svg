<svg width="100%" height="16" viewBox="0 0 1200 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#020804" stop-opacity="0"/>
      <stop offset="35%" stop-color="#1b5e3a" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#2ecc71" stop-opacity="1"/>
      <stop offset="65%" stop-color="#1b5e3a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020804" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Horizontal line -->
  <rect x="0" y="7" width="1200" height="2" fill="url(#divGrad)"/>

  <!-- Center Botanical Element -->
  <g transform="translate(600, 8)" filter="url(#glow)">
    <!-- Central leaf glyph -->
    <path d="M 0,-6 C -6,-3 -6,3 0,6 C 6,3 6,-3 0,-6 Z" fill="#2ecc71"/>
    <!-- Small bud/accents -->
    <circle cx="-12" cy="0" r="1.5" fill="#1b5e3a"/>
    <circle cx="12" cy="0" r="1.5" fill="#1b5e3a"/>
  </g>
</svg>
