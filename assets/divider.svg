<svg width="100%" height="16" viewBox="0 0 1200 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050000" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8b0000" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#ff2d2d" stop-opacity="1"/>
      <stop offset="65%" stop-color="#8b0000" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#050000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Horizontal line -->
  <rect x="0" y="7" width="1200" height="2" fill="url(#divGrad)"/>

  <!-- Center Demonic Element -->
  <g transform="translate(600, 8)" filter="url(#glow)">
    <!-- Central diamond -->
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#ff2d2d"/>
    <!-- Accents -->
    <path d="M -20,0 Q -10,-4 0,0 Q -10,4 -20,0 Z" fill="#8b0000"/>
    <path d="M 20,0 Q 10,-4 0,0 Q 10,4 20,0 Z" fill="#8b0000"/>
  </g>
</svg>
