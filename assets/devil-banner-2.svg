<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Devil banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#060606"/>
      <stop offset="100%" stop-color="#120202"/>
    </linearGradient>
    <linearGradient id="burn" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff2b2b"/>
      <stop offset="60%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#ffdd66"/>
    </linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)" />

  <!-- subtle flames at the bottom -->
  <g transform="translate(0,180)">
    <image href="./flames.svg" x="0" y="-40" width="1200" height="140"/>
  </g>

  <!-- Devil silhouette (simplified) -->
  <g transform="translate(80,10) scale(1.1)">
    <path d="M220 60 C180 10, 140 0, 100 40 C80 60, 80 100, 120 120 C140 130, 180 130, 220 120 C260 110, 260 70, 240 50 C230 40, 225 35, 220 60 Z" fill="#070707" stroke="#2b0707" stroke-width="2"/>
    <path d="M420 60 C460 10, 500 0, 540 40 C560 60, 560 100, 520 120 C500 130, 460 130, 420 120 C380 110, 380 70, 400 50 C410 40, 415 35, 420 60 Z" fill="#070707" stroke="#2b0707" stroke-width="2"/>
  </g>

  <!-- Title text -->
  <text x="600" y="120" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial" font-size="42" fill="#ff3b3b" filter="url(#g)">YASH DHADVE</text>
  <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial" font-size="18" fill="#f5c6b3">Full Stack Developer • Cloud • Automation • Cybersecurity</text>

  <!-- Dev mode ribbon -->
  <rect x="30" y="20" width="220" height="40" rx="6" fill="#100606" stroke="#3b0b0b"/>
  <text x="140" y="45" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial" font-size="14" fill="#ff6b6b">🔥 DEV MODE: UNLEASHED</text>

</svg>
