<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="120" viewBox="0 0 300 120" role="img" aria-label="Devil logo">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#ff9a1f"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Horns -->
  <path d="M40 60 C10 10, 70 0, 90 40 C70 20, 50 40, 40 60 Z" fill="#1b0b0b" stroke="url(#g)" stroke-width="3"/>
  <path d="M260 60 C290 10, 230 0, 210 40 C230 20, 250 40, 260 60 Z" fill="#1b0b0b" stroke="url(#g)" stroke-width="3"/>

  <!-- Face -->
  <ellipse cx="150" cy="70" rx="70" ry="38" fill="#0d0d0d" />

  <!-- Eyes -->
  <g filter="url(#glow)">
    <ellipse cx="125" cy="68" rx="10" ry="6" fill="#ff2b2b">
      <animate attributeName="rx" values="10;12;10" dur="1.6s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="175" cy="68" rx="10" ry="6" fill="#ff2b2b">
      <animate attributeName="rx" values="10;12;10" dur="1.6s" begin="0.3s" repeatCount="indefinite" />
    </ellipse>
  </g>

  <!-- Jaw / Smile subtle -->
  <path d="M120 84 Q150 98 180 84" stroke="#4b0b0b" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- DEV MODE label -->
  <text x="150" y="30" text-anchor="middle" font-family="Segoe UI, Roboto, Arial" font-size="16" fill="#ff6b6b">DEV MODE</text>
  <text x="150" y="48" text-anchor="middle" font-family="Segoe UI, Roboto, Arial" font-size="11" fill="#b23">
    UNLEASHED
  </text>
</svg>
