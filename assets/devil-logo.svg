<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0000" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Glowing Background -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGlow)"/>
  
  <!-- Outer Sigil Ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#8b0000" stroke-width="1.5" opacity="0.7"/>
  <circle cx="50" cy="50" r="37" fill="none" stroke="#ff2d2d" stroke-width="0.5" opacity="0.4"/>

  <!-- Demonic Mask Silhouette -->
  <g transform="translate(10, 10)">
    <!-- Horns -->
    <path d="M 28,30 C 20,10 5,0 18,5 C 22,12 25,20 28,28 Z" fill="#4a0000" stroke="#ff2d2d" stroke-width="0.5"/>
    <path d="M 52,30 C 60,10 75,0 62,5 C 58,12 55,20 52,28 Z" fill="#4a0000" stroke="#ff2d2d" stroke-width="0.5"/>
    
    <!-- Face structure -->
    <path d="M 28,28 L 52,28 L 56,45 L 40,65 L 24,45 Z" fill="#1b0000" stroke="#8b0000" stroke-width="1"/>
    <!-- Brow/Forehead line -->
    <path d="M 28,28 L 40,36 L 52,28" fill="none" stroke="#ff2d2d" stroke-width="1"/>
    
    <!-- Glowing Red Eyes -->
    <polygon points="31,38 39,41 33,44" fill="#ff0000" filter="url(#glow)"/>
    <polygon points="49,38 41,41 47,44" fill="#ff0000" filter="url(#glow)"/>
    
    <!-- Mouth/Teeth Lines -->
    <path d="M 35,53 L 40,50 L 45,53" fill="none" stroke="#ff2d2d" stroke-width="1"/>
    <path d="M 37,56 L 40,59 L 43,56" fill="none" stroke="#ff2d2d" stroke-width="1"/>
  </g>
</svg>
