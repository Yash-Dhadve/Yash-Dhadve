<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050000"/>
      <stop offset="50%" stop-color="#140101"/>
      <stop offset="100%" stop-color="#050000"/>
    </linearGradient>
    
    <radialGradient id="glowRed" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ff1a1a" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#800000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3300" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#990000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050000" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Red-Metallic Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ff4d4d"/>
      <stop offset="70%" stop-color="#b30000"/>
      <stop offset="100%" stop-color="#4d0000"/>
    </linearGradient>

    <linearGradient id="subTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9999"/>
      <stop offset="50%" stop-color="#ff3333"/>
      <stop offset="100%" stop-color="#ff9999"/>
    </linearGradient>

    <!-- Filters for Glow and Shadows -->
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComponentTransfer in="blur" result="brightBlur">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="brightBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#glowRed)">
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- Ambient Inferno Flames at the bottom -->
  <rect x="0" y="180" width="1200" height="80" fill="url(#fireGrad)"/>

  <!-- Left Demonic Entity / Horns Silhouette & Eyes -->
  <g transform="translate(80, 45)">
    <!-- Horns Silhouette -->
    <path d="M 40,110 C 20,40 -10,10 25,20 C 15,45 20,70 30,95 Z" fill="#260000" opacity="0.85"/>
    <path d="M 120,110 C 140,40 170,10 135,20 C 145,45 140,70 130,95 Z" fill="#260000" opacity="0.85"/>
    <!-- Head Contour -->
    <path d="M 30,95 C 40,85 50,80 80,80 C 110,80 120,85 130,95 C 120,125 110,140 80,140 C 50,140 40,125 30,95 Z" fill="#140000"/>
    <!-- Glowing Eyes (Animated) -->
    <polygon points="55,105 70,108 58,113" fill="#ff0000" filter="url(#eyeGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="105,105 90,108 102,113" fill="#ff0000" filter="url(#eyeGlow)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Right Demonic Entity / Horns Silhouette & Eyes -->
  <g transform="translate(960, 45)">
    <!-- Horns Silhouette -->
    <path d="M 40,110 C 20,40 -10,10 25,20 C 15,45 20,70 30,95 Z" fill="#260000" opacity="0.85"/>
    <path d="M 120,110 C 140,40 170,10 135,20 C 145,45 140,70 130,95 Z" fill="#260000" opacity="0.85"/>
    <!-- Head Contour -->
    <path d="M 30,95 C 40,85 50,80 80,80 C 110,80 120,85 130,95 C 120,125 110,140 80,140 C 50,140 40,125 30,95 Z" fill="#140000"/>
    <!-- Glowing Eyes (Animated) -->
    <polygon points="55,105 70,108 58,113" fill="#ff0000" filter="url(#eyeGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="105,105 90,108 102,113" fill="#ff0000" filter="url(#eyeGlow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- Floating Embers (Vibrant Orange & Red particles) -->
  <g fill="#ff3300">
    <circle cx="150" cy="240" r="2.5">
      <animate attributeName="cy" values="240;30;240" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="150;180;150" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="220" r="1.5">
      <animate attributeName="cy" values="220;50;220" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="280;260;280" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="230" r="2">
      <animate attributeName="cy" values="230;40;230" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="500;530;500" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="250" r="3">
      <animate attributeName="cy" values="250;20;250" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="700;670;700" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="210" r="2">
      <animate attributeName="cy" values="210;60;210" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="900;920;900" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Central Crest / Sigil background -->
  <g opacity="0.08" stroke="#ff0000" stroke-width="2" fill="none">
    <circle cx="600" cy="130" r="110"/>
    <polygon points="600,30 682,145 518,145" stroke="#ff0000"/>
    <polygon points="600,230 682,115 518,115" stroke="#ff0000"/>
  </g>

  <!-- Hero Text -->
  <g filter="url(#textGlow)">
    <text x="600" y="115" text-anchor="middle" font-family="'Cinzel', 'Segoe UI', serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="8">
      YASH DHADVE
    </text>
  </g>
  <text x="600" y="155" text-anchor="middle" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="url(#subTitleGrad)" letter-spacing="4">
    FULL STACK DEVELOPER • PYTHON DEVELOPER
  </text>
  
  <text x="600" y="195" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#ff5555" letter-spacing="2">
    🔥 DEV MODE: UNLEASHED 🔥
  </text>
</svg>
