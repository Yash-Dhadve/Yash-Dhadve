<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0000"/>
      <stop offset="55%" stop-color="#1a0303"/>
      <stop offset="100%" stop-color="#0a0000"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff4d00"/>
      <stop offset="50%" stop-color="#c40808"/>
      <stop offset="100%" stop-color="#4a0000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5b5b"/>
      <stop offset="50%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#8b0000"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#glowRed)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- faint pentagram-style geometric accent, kept subtle -->
  <g opacity="0.06" stroke="#ff2d2d" stroke-width="1.5" fill="none">
    <circle cx="600" cy="130" r="150"/>
    <circle cx="600" cy="130" r="105"/>
  </g>

  <!-- rising embers -->
  <g fill="#ff5b1f">
    <circle cx="120" cy="220" r="2.4"><animate attributeName="cy" values="220;20;220" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="230" r="1.8"><animate attributeName="cy" values="230;40;230" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="225" r="2.2"><animate attributeName="cy" values="225;30;225" dur="6.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="210" r="1.6"><animate attributeName="cy" values="210;25;210" dur="5.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="200" r="1.4"><animate attributeName="cy" values="200;10;200" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- devil horns silhouette, left -->
  <g transform="translate(150,60)" fill="#3a0000" opacity="0.9">
    <path d="M0 60 C 10 10, 35 -10, 55 5 C 40 20, 32 45, 34 70 Z"/>
    <path d="M110 60 C 100 10, 75 -10, 55 5 C 70 20, 78 45, 76 70 Z"/>
  </g>
  <!-- glowing eyes under horns -->
  <g>
    <ellipse cx="178" cy="95" rx="6" ry="3.5" fill="#ff0000" filter="url(#softBlur)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="208" cy="95" rx="6" ry="3.5" fill="#ff0000" filter="url(#softBlur)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- flame accent base -->
  <rect x="0" y="235" width="1200" height="25" fill="url(#fireGrad)" opacity="0.5"/>

  <!-- title -->
  <text x="600" y="115" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="800" fill="url(#titleGrad)" letter-spacing="4">
    YASH DHADVE
  </text>
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#ff8a8a" letter-spacing="3">
    FULL-STACK &amp; PYTHON DEVELOPER
  </text>
  <text x="600" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#8a3a3a" letter-spacing="2">
    🔥 DEV MODE : UNLEASHED 🔥
  </text>
</svg>
